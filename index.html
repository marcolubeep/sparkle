<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #3a9e7e;

    --green-dark: #1f6b53;

    --muted: #6b8f7e;
    --white: #ffffff;
    --bg: #f5fbf8;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Nunito', sans-serif; font-weight: 400; color: var(--text); background: var(--bg); overflow-x: hidden; }

  /* NAV */
  <nav style="display: flex; flex-direction: column; align-items: center; padding: 0;">
    <a href="#" style="display: block; width: 100%;">
        <img src="preview.webp" alt="Sparkle MK - Wide Banner Header" style="width: 100%; height: auto; display: block; object-fit: cover;">
    </a>
    <div style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 1rem; padding: 1rem 2rem; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-top: 1px solid rgba(58,158,126,0.1);">

    </div>
</nav>

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #d4eef8 0%, #e8f7f2 50%, #c8edd8 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6rem 1.5rem 4rem; position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 70% 20%, rgba(58,158,126,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, rgba(212,238,248,0.6) 0%, transparent 50%);
  }
  .hero-logo {
    position: relative; z-index: 1; margin-bottom: 1.5rem;
    animation: fadeDown 0.8s ease both;
  }
  .hero-logo img {
    width: 130px; height: 130px; object-fit: contain;
    filter: drop-shadow(0 6px 24px rgba(58,158,126,0.3));
  }
  @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }

  .hero-badge {
    position: relative; z-index: 1;
    display: inline-block;
    background: rgba(58,158,126,0.12); color: var(--green-dark);
    font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    padding: 6px 18px; border-radius: 50px; margin-bottom: 1rem;
    animation: fadeUp 0.8s ease 0.1s both;
  }
  .hero h1 {
    position: relative; z-index: 1;
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 3.8rem); line-height: 1.15;
    color: var(--text); margin-bottom: 1.2rem;
    animation: fadeUp 0.8s ease 0.2s both;
  }
  .hero h1 span { color: var(--green); }
  .hero-sub {
    position: relative; z-index: 1;
    font-size: clamp(1rem, 2.5vw, 1.15rem); color: var(--muted);
