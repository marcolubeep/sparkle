<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkle MK — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #3a9e7e; --green-light: #e8f7f2; --green-dark: #1f6b53;
    --text: #1a2e25; --muted: #6b8f7e; --bg: #f5fbf8;
    --border: rgba(58,158,126,0.18); --error: #c0392b; --white: #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-logo span { font-weight: 800; font-size: 1.2rem; color: var(--text); }
  .nav-logo span em { font-style: normal; color: var(--green); }
  .nav-badge {
    background: var(--green-dark); color: white;
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 4px 12px; border-radius: 50px;
  }
  .nav-right { display: flex; align-items: center; gap: 1rem; }
  .btn-logout {
    background: transparent; border: 1.5px solid var(--border);
    color: var(--muted); padding: 7px 18px; border-radius: 50px;
    font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s; display: none;
  }
  .btn-logout:hover { border-color: var(--error); color: var(--error); }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 6rem 1.5rem 2rem;
  }
  .login-card {
    background: white; border-radius: 24px; padding: 2.5rem 2rem;
    border: 1px solid var(--border); box-shadow: 0 4px 32px rgba(58,158,126,0.1);
    width: 100%; max-width: 380px; text-align: center;
  }
  .login-icon { font-size: 2.5rem; margin-bottom: 1rem; }
  .login-card h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 0.4rem; }
  .login-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.75rem; }
  .login-card input {
    width: 100%; padding: 11px 16px; border: 1.5px solid var(--border);
    border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 0.95rem;
    color: var(--text); background: var(--bg); outline: none; margin-bottom: 0.75rem;
    transition: border-color 0.2s;
  }
  .login-card input:focus { border-color: var(--green); }
  .btn-login {
    width: 100%; padding: 12px; background: var(--green); color: white;
    border: none; border-radius: 50px; font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 800; cursor: pointer; transition: background 0.2s;
  }
  .btn-login:hover { background: var(--green-dark); }
  .login-error {
    background: #fdf0ee; border: 1px solid #e8b4ae; color: var(--error);
    border-radius: 8px; padding: 8px 14px; font-size: 0.85rem;
    margin-top: 0.75rem; display: none;
  }

  /* ── ADMIN DASHBOARD ── */
  #admin-screen { display: none; padding: 5.5rem 1.5rem 3rem; max-width: 1200px; margin: 0 auto; }

  .dashboard-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1rem;
  }
  .dashboard-header h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; }
  .dashboard-header p { color: var(--muted); font-size: 0.88rem; }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.75rem; }
  .stat-card {
    background: white; border-radius: 16px; padding: 1.25rem 1.5rem;
    border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(58,158,126,0.06);
  }
  .stat-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
  .stat-value { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--green-dark); font-weight: 700; }
  .stat-sub { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }

  /* FILTERS */
  .filters {
    display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem; align-items: center;
  }
  .filters input, .filters select {
    padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 50px;
    font-family: 'Nunito', sans-serif; font-size: 0.85rem; color: var(--text);
    background: white; outline: none; transition: border-color 0.2s;
  }
  .filters input:focus, .filters select:focus { border-color: var(--green); }
  .filters input { min-width: 200px; }
  .btn-refresh {
    padding: 8px 18px; background: var(--green-light); color: var(--green-dark);
    border: none; border-radius: 50px; font-family: 'Nunito', sans-serif;
    font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
    margin-left: auto;
  }
  .btn-refresh:hover { background: var(--border); }

  /* TABLE */
  .table-wrap {
    background: white; border-radius: 20px; border: 1px solid var(--border);
    box-shadow: 0 2px 20px rgba(58,158,126,0.07); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--green-light); }
  th {
    padding: 12px 16px; text-align: left; font-size: 0.75rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--green-dark);
    white-space: nowrap;
  }
  td {
    padding: 12px 16px; font-size: 0.875rem; color: var(--text);
    border-top: 1px solid var(--border); vertical-align: middle;
  }
  tr:hover td { background: var(--bg); }
  .ref-code { font-weight: 800; font-size: 0.8rem; color: var(--green-dark); letter-spacing: 0.05em; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 50px;
    font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .badge-paid    { background: #e8f7f2; color: #1f6b53; }
  .badge-pending { background: #fef9e7; color: #b7770d; }
  .badge-cancelled { background: #fdf0ee; color: #c0392b; }
  .svc-badge {
    display: inline-block; padding: 3px 10px; border-radius: 50px;
    font-size: 0.72rem; font-weight: 700; background: var(--bg); color: var(--muted);
  }
  .empty-state {
    text-align: center; padding: 3rem; color: var(--muted); font-size: 0.95rem;
  }
  .empty-state span { font-size: 2rem; display: block; margin-bottom: 0.5rem; }

  .loading { text-align: center; padding: 2rem; color: var(--muted); }
  .loading span { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MOBILE */
  @media (max-width: 700px) {
    .hide-mobile { display: none; }
    nav { padding: 0.85rem 1.2rem; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="index.html">
    <span>Sparkle <em>MK</em></span>
  </a>
  <div class="nav-right">
    <span class="nav-badge">Admin</span>
    <button class="btn-logout" id="logout-btn" onclick="logout()">Log out</button>
  </div>
</nav>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h2>Admin access</h2>
    <p>Enter your admin password to view bookings</p>
    <input type="email" id="admin-email" placeholder="Admin email" autocomplete="username">
    <input type="password" id="admin-password" placeholder="Password" autocomplete="current-password"
      onkeydown="if(event.key==='Enter') login()">
    <button class="btn-login" onclick="login()">Sign in →</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="admin-screen">

  <div class="dashboard-header">
    <div>
      <h1>Bookings dashboard</h1>
      <p id="last-updated">Loading...</p>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total bookings</div>
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-sub">all time</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">This month</div>
      <div class="stat-value" id="stat-month">—</div>
      <div class="stat-sub" id="stat-month-label">bookings</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Revenue</div>
      <div class="stat-value" id="stat-revenue">—</div>
      <div class="stat-sub">paid bookings</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Upcoming</div>
      <div class="stat-value" id="stat-upcoming">—</div>
      <div class="stat-sub">next 7 days</div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <input type="text" id="filter-search" placeholder="🔍  Search name, email, ref..." oninput="applyFilters()">
    <select id="filter-service" onchange="applyFilters()">
      <option value="">All services</option>
      <option value="domestic">Domestic</option>
      <option value="deep">Deep Clean</option>
      <option value="office">Office</option>
    </select>
    <select id="filter-status" onchange="applyFilters()">
      <option value="">All statuses</option>
      <option value="paid">Paid</option>
      <option value="pending">Pending</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <button class="btn-refresh" onclick="loadBookings()">↻ Refresh</button>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <div class="loading" id="table-loading"><span>⟳</span> Loading bookings…</div>
    <table id="bookings-table" style="display:none">
      <thead>
        <tr>
          <th>Ref</th>
          <th>Name</th>
          <th>Service</th>
          <th class="hide-mobile">Date</th>
          <th class="hide-mobile">Address</th>
          <th>Total</th>
          <th>Status</th>
          <th class="hide-mobile">Booked</th>
        </tr>
      </thead>
      <tbody id="bookings-body"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none">
      <span>📋</span>
      No bookings found.
    </div>
  </div>

</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────
// 🔧 REPLACE with your Supabase project URL and anon key
const SUPABASE_URL  = 'https://YOUR_PROJECT.supabase.co'
const SUPABASE_ANON = 'YOUR_ANON_KEY'  // Project Settings → Data API → anon key

// 🔧 SET YOUR ADMIN PASSWORD (or use Supabase Auth for production)
const ADMIN_EMAIL    = 'admin@sparklemk.co.uk'
const ADMIN_PASSWORD = 'SparkleAdmin2025!'

// ─── STATE ────────────────────────────────────────────────────────────────
let allBookings = []
let authToken   = null

// ─── LOGIN ────────────────────────────────────────────────────────────────
async function login() {
  const email    = document.getElementById('admin-email').value.trim()
  const password = document.getElementById('admin-password').value
  const errEl    = document.getElementById('login-error')
  errEl.style.display = 'none'

  // Sign in with Supabase Auth
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON
    },
    body: JSON.stringify({ email, password })
  })

  const data = await res.json()

  if (!res.ok) {
    errEl.textContent = 'Invalid email or password.'
    errEl.style.display = 'block'
    return
  }

  authToken = data.access_token
  sessionStorage.setItem('smk_admin_token', authToken)
  showDashboard()
}

function logout() {
  sessionStorage.removeItem('smk_admin_token')
  authToken = null
  document.getElementById('login-screen').style.display = 'flex'
  document.getElementById('admin-screen').style.display  = 'none'
  document.getElementById('logout-btn').style.display    = 'none'
  document.getElementById('admin-password').value = ''
}

function showDashboard() {
  document.getElementById('login-screen').style.display = 'none'
  document.getElementById('admin-screen').style.display  = 'block'
  document.getElementById('logout-btn').style.display    = 'inline-block'
  loadBookings()
}

// ─── LOAD BOOKINGS FROM SUPABASE ──────────────────────────────────────────
async function loadBookings() {
  document.getElementById('table-loading').style.display = 'block'
  document.getElementById('bookings-table').style.display = 'none'
  document.getElementById('empty-state').style.display   = 'none'

  const token = authToken || sessionStorage.getItem('smk_admin_token')
  if (!token) return

  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/bookings?select=*&order=created_at.desc`,
    {
      headers: {
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      }
    }
  )

  if (res.status === 401) { logout(); return }

  allBookings = await res.json()

  updateStats()
  applyFilters()

  const now = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
  document.getElementById('last-updated').textContent = `Last updated at ${now}`
}

// ─── STATS ────────────────────────────────────────────────────────────────
function updateStats() {
  const paid = allBookings.filter(b => b.status === 'paid')
  const now  = new Date()
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1)
  const nextWeek   = new Date(now); nextWeek.setDate(nextWeek.getDate() + 7)

  const thisMonth = allBookings.filter(b => new Date(b.created_at) >= monthStart)
  const revenue   = paid.reduce((s, b) => s + (Number(b.total) || 0), 0)
  const upcoming  = allBookings.filter(b => {
    if (!b.date) return false
    const d = new Date(b.date)
    return d >= now && d <= nextWeek
  })

  document.getElementById('stat-total').textContent    = allBookings.length
  document.getElementById('stat-month').textContent    = thisMonth.length
  document.getElementById('stat-revenue').textContent  = '£' + revenue.toFixed(0)
  document.getElementById('stat-upcoming').textContent = upcoming.length

  const monthName = now.toLocaleString('en-GB', { month: 'long' })
  document.getElementById('stat-month-label').textContent = `in ${monthName}`
}

// ─── FILTERS ──────────────────────────────────────────────────────────────
function applyFilters() {
  const search  = document.getElementById('filter-search').value.toLowerCase()
  const service = document.getElementById('filter-service').value
  const status  = document.getElementById('filter-status').value

  const filtered = allBookings.filter(b => {
    const matchSearch = !search ||
      (b.name  || '').toLowerCase().includes(search) ||
      (b.email || '').toLowerCase().includes(search) ||
      (b.ref   || '').toLowerCase().includes(search) ||
      (b.address || '').toLowerCase().includes(search)
    const matchService = !service || b.service === service
    const matchStatus  = !status  || b.status  === status
    return matchSearch && matchService && matchStatus
  })

  renderTable(filtered)
}

// ─── RENDER TABLE ─────────────────────────────────────────────────────────
const SVC_LABELS = { domestic: 'Domestic', deep: 'Deep Clean', office: 'Office' }
const FREQ_LABELS = { 'one-off': 'One-off', weekly: 'Weekly', fortnightly: 'Fortnightly' }

function renderTable(bookings) {
  document.getElementById('table-loading').style.display = 'none'

  if (bookings.length === 0) {
    document.getElementById('bookings-table').style.display = 'none'
    document.getElementById('empty-state').style.display   = 'block'
    return
  }

  document.getElementById('bookings-table').style.display = 'table'
  document.getElementById('empty-state').style.display   = 'none'

  const tbody = document.getElementById('bookings-body')
  tbody.innerHTML = bookings.map(b => {
    const dateStr = b.date
      ? new Date(b.date + 'T12:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })
      : '—'
    const bookedStr = new Date(b.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short' })
    const statusBadge = `<span class="badge badge-${b.status || 'pending'}">${b.status || 'pending'}</span>`
    const svcLabel = SVC_LABELS[b.service] || b.service || '—'
    const freq = b.frequency && b.frequency !== 'one-off' ? ` · ${FREQ_LABELS[b.frequency] || b.frequency}` : ''

    return `<tr>
      <td><span class="ref-code">${b.ref || '—'}</span></td>
      <td>
        <div style="font-weight:700">${b.name || (b.fname ? b.fname + ' ' + b.lname : '—')}</div>
        <div style="font-size:0.78rem;color:var(--muted)">${b.email || ''}</div>
        ${b.phone ? `<div style="font-size:0.78rem;color:var(--muted)">${b.phone}</div>` : ''}
      </td>
      <td>
        <span class="svc-badge">${svcLabel}</span>
        <div style="font-size:0.75rem;color:var(--muted);margin-top:3px">${b.size || ''}${freq}</div>
      </td>
      <td class="hide-mobile">
        <div>${dateStr}</div>
        <div style="font-size:0.78rem;color:var(--muted)">${b.time || ''}</div>
      </td>
      <td class="hide-mobile" style="font-size:0.82rem;max-width:180px;color:var(--muted)">${b.address || '—'}</td>
      <td style="font-weight:800;color:var(--green-dark)">${b.total ? '£' + Number(b.total).toFixed(2) : '—'}</td>
      <td>${statusBadge}</td>
      <td class="hide-mobile" style="font-size:0.78rem;color:var(--muted)">${bookedStr}</td>
    </tr>`
  }).join('')
}

// ─── INIT ─────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const token = sessionStorage.getItem('smk_admin_token')
  if (token) {
    authToken = token
    showDashboard()
  }
})
</script>
</body>
</html>
