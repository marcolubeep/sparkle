<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkle MK — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #3a9e7e; --green-light: #e8f7f2; --green-dark: #1f6b53;
    --text: #1a2e25; --muted: #6b8f7e; --bg: #f5fbf8;
    --border: rgba(58,158,126,0.18); --error: #c0392b; --white: #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-logo span { font-weight: 800; font-size: 1.2rem; color: var(--text); }
  .nav-logo span em { font-style: normal; color: var(--green); }
  .nav-badge {
    background: var(--green-dark); color: white;
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 4px 12px; border-radius: 50px;
  }
  .nav-right { display: flex; align-items: center; gap: 1rem; }
  .btn-logout {
    background: transparent; border: 1.5px solid var(--border);
    color: var(--muted); padding: 7px 18px; border-radius: 50px;
    font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s; display: none;
  }
  .btn-logout:hover { border-color: var(--error); color: var(--error); }
