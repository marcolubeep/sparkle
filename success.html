<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Sparkle MK</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #3a9e7e; --green-light: #e8f7f2; --green-dark: #1f6b53;
    --text: #1a2e25; --muted: #6b8f7e; --bg: #f5fbf8;
    --border: rgba(58,158,126,0.18); --white: #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(58,158,126,0.1);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-logo span { font-weight: 800; font-size: 1.2rem; color: var(--text); }
  .nav-logo span em { font-style: normal; color: var(--green); }

  /* MAIN */
  main { flex: 1; padding: 8rem 1.5rem 4rem; max-width: 550px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: center; }

  .success-card {
    background: white; border-radius: 24px; padding: 3rem 2rem;
    border: 1px solid var(--border); text-align: center;
    box-shadow: 0 4px 32px rgba(58,158,126,0.08); width: 100%;
  }
  .success-icon { font-size: 4rem; margin-bottom: 1.25rem; display: block; }
  .success-card h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--text); margin-bottom: 0.75rem; }
  .success-card p { color: var(--muted); line-height: 1.6; font-size: 1rem; margin-bottom: 1.75rem; }
  
  .success-ref-box {
    background: var(--green-light); border: 1px solid rgba(58,158,126,0.2);
    border-radius: 14px; padding: 1rem; margin-bottom: 2rem;
  }
  .success-ref-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--green-dark); margin-bottom: 4px; }
  .success-ref { font-size: 1.3rem; font-weight: 800; color: var(--text); letter-spacing: 0.05em; }

  .btn-home {
    display: inline-block; width: 100%; padding: 14px 28px; background: var(--green); color: white;
    text-decoration: none; border-radius: 50px; font-weight: 800; font-size: 1rem;
    transition: background 0.2s, transform 0.15s;
  }
  .btn-home:hover { background: var(--green-dark); transform: translateY(-1px); }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="./">
    <span>Sparkle <em>MK</em></span>
  </a>
</nav>

<main>
  <div class="success-card">
    <span class="success-icon">🎉</span>
    <h1>You're all booked!</h1>
    <p>Thank you for choosing Sparkle MK. Your payment was successful, your booking is confirmed, and you'll receive a confirmation email shortly.</p>
    
    <div class="success-ref-box">
      <div class="success-ref-label">Booking Reference</div>
      <div class="success-ref" id="success-ref">SMK-CONFIRMED</div>
    </div>

    <a href="./" class="btn-home">← Back to home</a>
  </div>
</main>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    // Recupera la referenza memorizzata temporaneamente prima del pagamento
    const ref = sessionStorage.getItem('smk_pending_ref');
    if (ref) {
      document.getElementById('success-ref').textContent = ref;
      // Opzionale: puliamo la sessione così se ricaricano la pagina non si confonde
      sessionStorage.removeItem('smk_pending_ref');
    }
  });
</script>
</body>
</html>
