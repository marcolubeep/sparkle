<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkle MK — Book a Clean</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #3a9e7e; --green-light: #e8f7f2; --green-dark: #1f6b53;
    --text: #1a2e25; --muted: #6b8f7e; --bg: #f5fbf8;
    --border: rgba(58,158,126,0.18); --error: #c0392b; --white: #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(58,158,126,0.1);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-logo span { font-weight: 800; font-size: 1.2rem; color: var(--text); }
  .nav-logo span em { font-style: normal; color: var(--green); }
  .nav-back {
    background: var(--green-light); color: var(--green-dark); text-decoration: none;
    padding: 8px 20px; border-radius: 50px; font-weight: 700; font-size: 0.88rem;
    transition: background 0.2s;
  }
  .nav-back:hover { background: var(--border); }

  /* MAIN */
  main { padding: 6rem 1.5rem 4rem; max-width: 680px; margin: 0 auto; }

  .page-header { text-align: center; margin-bottom: 2.5rem; }
  .page-label {
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--green); font-weight: 700; margin-bottom: 0.5rem;
  }
  .page-header h1 {
    font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 5vw, 2.4rem);
    color: var(--text); margin-bottom: 0.5rem;
  }
  .page-header p { color: var(--muted); font-size: 0.95rem; }

  /* STEPS */
  .steps { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 2.5rem; }
  .step {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    flex: 1; max-width: 120px; cursor: pointer;
  }
  .step-num {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--green-light); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.85rem;
    border: 2px solid var(--border); transition: all 0.3s;
  }
  .step.active .step-num { background: var(--green); color: white; border-color: var(--green); }
  .step.done .step-num { background: var(--green-dark); color: white; border-color: var(--green-dark); }
  .step-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-align: center; }
  .step.active .step-label { color: var(--green-dark); }
  .step-line { flex: 1; height: 2px; background: var(--border); max-width: 40px; margin-bottom: 18px; }
  .step-line.done { background: var(--green); }

  /* CARD */
  .booking-card {
    background: white; border-radius: 20px; padding: 2rem;
    border: 1px solid var(--border);
    box-shadow: 0 2px 24px rgba(58,158,126,0.07);
  }

  .section-title {
    font-family: 'Playfair Display', serif; font-size: 1.15rem;
    color: var(--text); margin-bottom: 1.25rem; padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
  .form-group { margin-bottom: 1rem; }
  .form-group label {
    display: block; font-size: 0.82rem; font-weight: 700;
    color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-family: 'Nunito', sans-serif; font-size: 0.95rem; color: var(--text);
    background: var(--bg); transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--green); box-shadow: 0 0 0 3px rgba(58,158,126,0.1);
  }
  .form-group input.error,
  .form-group select.error { border-color: var(--error); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .field-error { font-size: 0.78rem; color: var(--error); margin-top: 3px; display: none; }

  /* PROMO CODE CONTAINER */
  .promo-wrapper { display: flex; gap: 0.5rem; margin-top: 5px; }
  .promo-wrapper input { margin-bottom: 0; }
  .btn-promo {
    padding: 0 16px; background: var(--green-light); color: var(--green-dark);
    border: 1.5px solid var(--border); border-radius: 10px; font-weight: 700;
    font-family: 'Nunito', sans-serif; font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
  }
  .btn-promo:hover { background: var(--border); }
  .promo-message { font-size: 0.8rem; margin-top: 5px; display: none; }
  .promo-message.success { color: var(--green-dark); font-weight: 700; }
  .promo-message.error { color: var(--error); }

  /* SERVICE CARDS */
  .service-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1rem; }
  @media (max-width: 500px) { .service-options { grid-template-columns: 1fr; } }
  .service-opt {
    border: 2px solid var(--border); border-radius: 12px; padding: 1rem 0.75rem;
    cursor: pointer; text-align: center; transition: all 0.2s;
    background: var(--bg);
  }
  .service-opt:hover { border-color: var(--green); background: var(--green-light); }
  .service-opt.selected { border-color: var(--green); background: var(--green-light); }
