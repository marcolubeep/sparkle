<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkle MK — Book a Clean</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
    :root { --green: #3a9e7e; --green-light: #e8f7f2; --green-dark: #1f6b53; --text: #1a2e25; --muted: #6b8f7e; --bg: #f5fbf8; --border: rgba(58,158,126,0.18); --error: #c0392b; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
    .booking-wrapper { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 20px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 1rem; }
    input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
    .btn-primary { width: 100%; padding: 12px; background: var(--green); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: 800; }
    .btn-primary:disabled { background: var(--muted); }
    #pay-error { color: var(--error); display: none; margin-top: 10px; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="booking-wrapper">
    <h1>Book your sparkle</h1>
    <div id="booking-form">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="jane@example.com">
        </div>
        <!-- Altri campi del form... -->
        <button id="pay-btn" class="btn-primary" onclick="submitBooking()">Continue to payment →</button>
        <div id="pay-error"></div>
    </div>
</div>

<script>
// Simulazione dati booking
const bookingData = {
    email: "", 
    stripeUrl: "https://buy.stripe.com/test_url" // Inserisci qui il tuo link Stripe
};

// Listener per aggiornare email
document.getElementById('email').addEventListener('input', (e) => {
    bookingData.email = e.target.value;
});

async function submitBooking() {
    const errEl = document.getElementById('pay-error');
    const btn = document.getElementById('pay-btn');
    
    if (!bookingData.email) {
        errEl.textContent = 'Inserisci un indirizzo email valido.';
        errEl.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Reindirizzamento a Stripe…';

    try {
        // Generazione riferimento univoco per il database
        const ref = 'SMK-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        
        // Salvataggio temporaneo del riferimento
        sessionStorage.setItem('smk_pending_ref', ref);
        
        // Reindirizzamento a Stripe passando il riferimento
        const stripeUrl = `${bookingData.stripeUrl}?client_reference_id=${ref}&prefilled_email=${encodeURIComponent(bookingData.email)}`;
        window.location.href = stripeUrl;

    } catch(e) {
        errEl.textContent = 'Errore di connessione. Riprova.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Continue to payment →';
    }
}

// Logica di ritorno dopo il pagamento[cite: 4]
window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('success') === 'true') {
        const ref = sessionStorage.getItem('smk_pending_ref');
        if (ref) {
            // Qui andrebbe la chiamata al tuo backend/Supabase per confermare il pagamento
            console.log("Pagamento confermato per il riferimento:", ref);
            sessionStorage.removeItem('smk_pending_ref');
            document.body.innerHTML = "<h1>Grazie! La tua pulizia è stata confermata.</h1>";
        }
    }
});
</script>

</body>
</html>
